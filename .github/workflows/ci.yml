name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: argos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Argos CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPRIVATE: github.com/devpablocristo/*
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start isolated SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.FOUNDATION_DEPLOY_KEY }}
          log-public-key: "false"

      # Argos is public, so GitHub cannot load Foundation's private composite
      # action. Keep the equivalent checks inline and fail close on a bad key.
      - name: Authorize private Foundation modules
        shell: bash
        env:
          EXPECTED_GITHUB_FINGERPRINT: SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU
        run: |
          set -euo pipefail

          known_hosts_file="${RUNNER_TEMP}/github_known_hosts"
          ssh-keyscan -t ed25519 github.com > "${known_hosts_file}" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "${known_hosts_file}" -E sha256 | awk '{print $2}')"
          if [ "${actual_fingerprint}" != "${EXPECTED_GITHUB_FINGERPRINT}" ]; then
            echo "the github.com host key does not match the pinned fingerprint" >&2
            exit 1
          fi
          chmod 0600 "${known_hosts_file}"

          git_ssh_command="ssh -F /dev/null -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts_file}"
          echo "GIT_SSH_COMMAND=${git_ssh_command}" >> "${GITHUB_ENV}"
          git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"
          GIT_SSH_COMMAND="${git_ssh_command}" git ls-remote git@github.com:devpablocristo/foundation.git HEAD >/dev/null

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run repository checks
        run: make test
